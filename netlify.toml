# Netlify tự chạy build mỗi khi có thay đổi trên GitHub (kể cả khi sửa trong /admin)
[build]
  command = "node build.mjs"
  publish = "dist"

[functions]
  # Hàm nhận lịch đặt và gửi Telegram: netlify/functions/dat-lich.mjs (đường dẫn /api/dat-lich)
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Liệu trình cũ (trước khi đổi bảng giá) → trang mới gần nhất, giữ link đã chia sẻ / Google đã lưu
[[redirects]]
  from = "/lieu-trinh/massage-co-vai-gay/"
  to = "/lieu-trinh/massage-co-vai-gay-chuyen-sau/"
  status = 301
[[redirects]]
  from = "/lieu-trinh/massage-lung-chuyen-sau/"
  to = "/lieu-trinh/massage-than-chuyen-sau/"
  status = 301
[[redirects]]
  from = "/lieu-trinh/massage-tinh-dau-toan-than/"
  to = "/lieu-trinh/massage-body-thu-gian/"
  status = 301
[[redirects]]
  from = "/lieu-trinh/cham-soc-da-mat-thuan-tu-nhien/"
  to = "/#bang-gia"
  status = 301
[[redirects]]
  from = "/lieu-trinh/dong-chay-thien-ha/"
  to = "/#bang-gia"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
