<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sổ lịch đặt · Thiên Hà Wellness</title>
  <style>
    :root { --navy:#0d2440; --tide:#2c7aa0; --ink:#0e1c2b; --muted:#5b6b7a; --line:#dde5eb; --bg:#f3f6f8; --white:#fff;
      --new:#fff2cc; --new-t:#7e5f00; --ok:#e2efda; --ok-t:#376e22; --here:#d9ebf3; --here-t:#174b6d; --cx:#fbe3e3; --cx-t:#9c0006; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; margin: 0; } header small { opacity: .75; }
    main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 60px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .bar input, .bar button, .bar a.btn { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--white); color: var(--ink); text-decoration: none; cursor: pointer; }
    .bar button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .bar .grow { flex: 1; min-width: 180px; }
    .sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .sum span { padding: 6px 12px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-size: 13px; }
    .day { margin: 18px 0 6px; font-weight: 700; color: var(--navy); font-size: 15px; }
    table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(7,20,38,.05); }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef3f6; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    td.t { white-space: nowrap; font-weight: 700; } td.code { font-family: ui-monospace, monospace; font-size: 12.5px; white-space: nowrap; }
    td a { color: var(--tide); } .note { color: var(--muted); font-size: 13px; }
    select.st { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; }
    select.st[data-v=moi] { background: var(--new); color: var(--new-t); } select.st[data-v=xac_nhan] { background: var(--ok); color: var(--ok-t); }
    select.st[data-v=da_den] { background: var(--here); color: var(--here-t); } select.st[data-v=huy] { background: var(--cx); color: var(--cx-t); }
    tr.huy td:not(:last-child) { opacity: .55; text-decoration: line-through; }
    .by { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .empty, .err { padding: 30px; text-align: center; color: var(--muted); background: var(--white); border-radius: 12px; }
    .err { color: var(--cx-t); background: var(--cx); }
    .foot { margin-top: 26px; padding: 14px; border-radius: 12px; background: var(--white); border: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
    .foot button { font: inherit; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--tide); background: var(--white); color: var(--tide); cursor: pointer; margin-right: 8px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 760px) {
      thead { display: none; } table, tbody, tr, td { display: block; width: 100%; }
      tr { border-bottom: 6px solid var(--bg); } td { border: 0; padding: 4px 12px; } td.t { padding-top: 10px; font-size: 16px; }
      td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
    }
  </style>
</head>
<body>
  <header><div><h1>Sổ lịch đặt · Thiên Hà Wellness</h1><small id="who"></small></div><a href="/admin/" style="color:#9cc3d6">← Trang quản trị nội dung</a></header>
  <main>
    <div class="bar">
      <button data-r="0" class="on">Hôm nay</button><button data-r="1">Ngày mai</button><button data-r="7">7 ngày tới</button><button data-r="-7">7 ngày qua</button>
      <input type="date" id="tu" aria-label="Từ ngày"> → <input type="date" id="den" aria-label="Đến ngày">
      <input class="grow" id="q" placeholder="Tìm tên, số điện thoại, mã lịch…">
      <a class="btn" id="csv" href="#">⬇ Xuất Excel</a>
    </div>
    <div class="sum" id="sum"></div>
    <div id="list"><div class="empty">Đang tải…</div></div>
    <div class="foot">
      <p><b>Quy tắc chặn trùng:</b> <span id="rule"></span></p>
      <button id="hook">Kết nối nút Xác nhận / Hủy trong Telegram</button> Chỉ cần bấm 1 lần (bấm lại nếu đã đổi token bot).
    </div>
  </main>
  <div class="toast" id="toast"></div>
<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hhmm = m => m == null ? "" : `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const dmy = d => d ? d.split("-").reverse().join("/") : "Chưa chọn ngày";
  const THU = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
  const vnToday = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const add = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
  const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t.h); t.h = setTimeout(() => t.classList.remove("show"), 2600); };
  let DATA = { items: [], status: {} };

  const setRange = r => {
    const t = vnToday();
    if (r === 0) { $("#tu").value = t; $("#den").value = t; }
    else if (r === 1) { $("#tu").value = add(t, 1); $("#den").value = add(t, 1); }
    else if (r > 0) { $("#tu").value = t; $("#den").value = add(t, r); }
    else { $("#tu").value = add(t, r); $("#den").value = t; }
    document.querySelectorAll("[data-r]").forEach(b => b.classList.toggle("on", +b.dataset.r === r));
    load();
  };

  async function load() {
    const tu = $("#tu").value, den = $("#den").value || tu;
    $("#csv").href = `/api/quan-ly-lich?tu=${tu}&den=${den}&xuat=csv`;
    try {
      const r = await fetch(`/api/quan-ly-lich?tu=${tu}&den=${den}`, { cache: "no-store" });
      const j = await r.json().catch(() => ({ ok: false, error: "Không đọc được dữ liệu (" + r.status + ")" }));
      if (!j.ok) throw new Error(j.error);
      DATA = j; $("#who").textContent = "Đăng nhập: " + (j.user || "");
      $("#rule").textContent = `mỗi khung giờ nhận tối đa ${j.cap} khách, chừa ${j.buffer} phút dọn phòng giữa 2 khách. Lịch “Đã hủy” trả lại giờ trống ngay.`;
      render();
    } catch (e) { $("#list").innerHTML = `<div class="err">${esc(e.message)}</div>`; $("#sum").innerHTML = ""; }
  }

  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const items = DATA.items.filter(b => !q || [b.name, b.phone, b.code, b.service, b.note].join(" ").toLowerCase().includes(q));
    const cnt = s => items.filter(b => b.status === s).length;
    $("#sum").innerHTML = `<span>Tổng: <b>${items.length}</b></span>` + Object.entries(DATA.status).map(([k, v]) => `<span>${esc(v)}: <b>${cnt(k)}</b></span>`).join("");
    if (!items.length) { $("#list").innerHTML = `<div class="empty">Không có lịch nào trong khoảng này.</div>`; return; }
    const days = [...new Set(items.map(b => b.date || ""))];
    $("#list").innerHTML = days.map(d => `<div class="day">${d ? THU[new Date(d).getUTCDay()] + ", " : ""}${dmy(d)}</div>
      <table><thead><tr><th>Giờ</th><th>Khách</th><th>Liệu trình</th><th>Ghi chú</th><th>Mã</th><th>Trạng thái</th></tr></thead><tbody>
      ${items.filter(b => (b.date || "") === d).map(b => `<tr class="${b.status}">
        <td class="t">${b.start != null ? hhmm(b.start) + "–" + hhmm(b.end) : "Linh hoạt"}</td>
        <td data-l="Khách"><b>${esc(b.name)}</b><br><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></td>
        <td data-l="Liệu trình">${esc(b.service || "Chưa chọn")}</td>
        <td data-l="Ghi chú" class="note">${esc(b.note)}</td>
        <td data-l="Mã" class="code">${esc(b.code)}<span class="by">Đặt ${esc(b.created)}</span></td>
        <td><select class="st" data-code="${esc(b.code)}" data-v="${b.status}">${Object.entries(DATA.status).map(([k, v]) => `<option value="${k}"${k === b.status ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
          ${b.by ? `<span class="by">${esc(b.by)} · ${esc(b.updated)}</span>` : ""}</td></tr>`).join("")}
      </tbody></table>`).join("");
  }

  document.addEventListener("change", async e => {
    const s = e.target.closest("select.st"); if (!s) return;
    const old = s.dataset.v, status = s.value;
    if (status === "huy" && !confirm("Hủy lịch " + s.dataset.code + "? Giờ này sẽ trống lại cho khách khác.")) { s.value = old; return; }
    s.disabled = true;
    const r = await fetch("/api/quan-ly-lich", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: s.dataset.code, status }) }).then(x => x.json()).catch(() => ({ ok: false, error: "Lỗi kết nối" }));
    if (!r.ok) { alert(r.error); s.value = old; s.disabled = false; return; }
    toast("Đã cập nhật " + s.dataset.code + " (tin Telegram cũng được sửa theo)"); load();
  });
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => setRange(+b.dataset.r));
  $("#tu").onchange = $("#den").onchange = () => { document.querySelectorAll("[data-r]").forEach(b => b.classList.remove("on")); load(); };
  $("#q").oninput = render;
  $("#hook").onclick = async () => {
    const r = await fetch("/api/quan-ly-lich", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "telegram" }) }).then(x => x.json()).catch(() => ({ ok: false, error: "Lỗi kết nối" }));
    alert(r.ok ? "Đã kết nối. Từ giờ bấm nút dưới tin lịch trong Telegram sẽ cập nhật sổ lịch." : r.error);
  };
  setRange(0);
  setInterval(load, 60e3);   // tự làm mới mỗi phút
})();
</script>
</body>
</html>
