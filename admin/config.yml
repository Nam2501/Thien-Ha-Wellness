# ==========================================================
#  TRANG QUẢN TRỊ (Decap CMS) — Thiên Hà Wellness
#  Kho GitHub: https://github.com/Nam2501/Thien-Ha-Wellness
# ==========================================================
backend:
  name: github
  repo: Nam2501/Thien-Ha-Wellness
  branch: main
  # Đăng nhập GitHub qua hàm Cloudflare: functions/api/auth.js + callback.js
  base_url: https://thien-ha-wellness.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    create: "Thêm {{collection}} “{{slug}}”"
    update: "Cập nhật {{collection}} “{{slug}}”"
    delete: "Xóa {{collection}} “{{slug}}”"
    uploadMedia: "Tải ảnh “{{path}}”"
    deleteMedia: "Xóa ảnh “{{path}}”"

# Sửa thử trên máy: mở cửa sổ lệnh tại thư mục web và gõ  npx decap-server@3.11.3
local_backend: true

locale: vi
site_url: /
display_url: /
logo_url: /images/favicon.svg

media_folder: images/uploads
public_folder: images/uploads

collections:
  # ---------------- THÔNG TIN SPA ----------------
  - name: settings
    label: "Thông tin spa"
    editor: { preview: false }
    files:
      - name: site
        label: "Liên hệ, giờ mở cửa & banner"
        file: data/site.json
        fields:
          - { name: name, label: "Tên spa", widget: string }
          - { name: phone, label: "Hotline (hiển thị)", widget: string, hint: "vd 0909 123 456 — tên, địa chỉ, SĐT phải khớp hồ sơ Google Maps (NAP)." }
          - { name: zalo, label: "Số Zalo (viết liền)", widget: string }
          - { name: zaloLink, label: "Link Zalo đầy đủ (nên điền)", widget: string, required: false, hint: "Link zalo.me/<số> chỉ mở được khi tài khoản cho phép người lạ tìm bằng số điện thoại. Dán link chia sẻ trang cá nhân hoặc link Zalo OA vào đây để luôn mở được." }
          - { name: email, label: "Email", widget: string, required: false }
          - { name: turnstileKey, label: "Chống bot đặt lịch giả — Turnstile Site key", widget: string, required: false, hint: "Lấy trong Cloudflare → Turnstile. Điền cùng lúc với biến bí mật TURNSTILE_SECRET trên Cloudflare. Để trống = tắt. Sổ lịch đặt: /admin/lich-dat/" }
          - { name: address, label: "Địa chỉ", widget: string, hint: "Ghi đầy đủ, giống hệt địa chỉ trên Google Business Profile." }
          - { name: hours, label: "Giờ mở cửa (hiển thị)", widget: string }
          - { name: mapUrl, label: "Link Google Maps của spa", widget: string }
          - { name: reviewUrl, label: "Link viết đánh giá Google", widget: string, hint: "Lấy trong Google Business Profile → Xin đánh giá." }
          - { name: facebook, label: "Link Facebook", widget: string, required: false }
          - name: socials
            label: "Nút liên hệ nổi (góc phải màn hình)"
            label_singular: "nút"
            widget: list
            collapsed: true
            hint: "Bật/tắt từng nút và dán link. Thứ tự trong danh sách = thứ tự hiển thị từ trên xuống (kéo để đổi). Nút đã bật mà chưa có link sẽ tự ẩn."
            summary: "{{fields.net}} — bật: {{fields.on}}"
            fields:
              - name: net
                label: "Kênh"
                widget: select
                options:
                  - { label: "Zalo (để trống link = dùng số/link Zalo ở trên)", value: zalo }
                  - { label: "Gọi điện (để trống = hotline ở trên)", value: phone }
                  - { label: "Messenger — vd https://m.me/tentrang", value: messenger }
                  - { label: "Facebook", value: facebook }
                  - { label: "TikTok", value: tiktok }
                  - { label: "Instagram", value: instagram }
                  - { label: "YouTube", value: youtube }
                  - { label: "WhatsApp — vd https://wa.me/84901234567", value: whatsapp }
                  - { label: "Telegram — vd https://t.me/tenkenh", value: telegram }
                  - { label: "KakaoTalk — link kênh/open chat", value: kakaotalk }
                  - { label: "Email (để trống = email ở trên)", value: email }
                  - { label: "Google Maps (để trống = link bản đồ ở trên)", value: maps }
              - { name: url, label: "Link", widget: string, required: false, hint: "Dán link đầy đủ bắt đầu bằng https://. Gọi điện: nhập số điện thoại. Email: nhập địa chỉ email." }
              - { name: "on", label: "Hiển thị trên website", widget: boolean, default: true, required: false }
          - { name: heroEyebrow, label: "Banner — dòng chữ nhỏ", widget: string }
          - { name: heroTitle, label: "Banner — tiêu đề lớn", widget: string, hint: "Đặt chữ trong dấu * để in nghiêng, vd: Thả trôi mệt mỏi, *như dòng nước* về biển lặng." }
          - { name: heroLead, label: "Banner — đoạn mô tả", widget: text }
          - { name: needsEyebrow, label: "Mục 'Cơ thể bạn cần gì' — dòng chữ nhỏ", widget: string, required: false }
          - { name: needsTitle, label: "Mục 'Cơ thể bạn cần gì' — tiêu đề", widget: string, required: false, hint: "Đặt chữ trong dấu * để in nghiêng, vd: Hôm nay, cơ thể bạn *cần điều gì?*" }
          - { name: needsSub, label: "Mục 'Cơ thể bạn cần gì' — mô tả ngắn", widget: string, required: false }
          - name: needs
            label: "Mục 'Cơ thể bạn cần gì' — các thẻ (nên để 4 thẻ)"
            label_singular: "thẻ"
            widget: list
            max: 8
            summary: "{{fields.title}} → {{fields.group}}"
            fields:
              - { name: title, label: "Tiêu đề thẻ", widget: string }
              - { name: desc, label: "Mô tả ngắn", widget: string }
              - { name: icon, label: "Biểu tượng", widget: select, default: drop, options: [ { label: "Đầu", value: head }, { label: "Cơ thể (body)", value: body }, { label: "Giọt nước & sóng", value: drop }, { label: "Cổ vai", value: neck }, { label: "Lưng", value: back }, { label: "Khuôn mặt", value: face }, { label: "Ngôi sao", value: star } ] }
              - { name: group, label: "Bấm vào thì tới nhóm dịch vụ", widget: select, options: &groups [ "Dịch vụ gội đầu", "Dịch vụ massage body thư giãn", "Dịch vụ massage dưỡng sinh & phục hồi sức khỏe", "Dịch vụ chăm sóc tai & mặt" ], hint: "Nhóm phải trùng với 'Nhóm dịch vụ' của các liệu trình trong Bảng giá." }

  # ---------------- SEO TOÀN WEBSITE ----------------
  - name: seo
    label: "SEO toàn website"
    editor: { preview: true }
    files:
      - name: seo
        label: "Cài đặt SEO"
        file: data/seo.json
        fields:
          - { name: siteUrl, label: "Tên miền chính", widget: string, required: false, hint: "vd https://thienhawellness.vn — không có dấu / ở cuối." }
          - { name: titleTemplate, label: "Mẫu tiêu đề", widget: string, hint: "%s là tiêu đề từng trang." }
          - { name: defaultImage, label: "Ảnh chia sẻ mặc định (1200×630, JPG/PNG)", widget: image, required: false }
          - { name: gscVerification, label: "Mã xác minh Google Search Console", widget: string, required: false }
          - { name: ga4Id, label: "Mã Google Analytics 4 (G-…)", widget: string, required: false }
          - { name: noindexAll, label: "Chặn Google lập chỉ mục TOÀN website", widget: boolean, default: false, hint: "Chỉ bật khi đang thử nghiệm." }
          - name: business
            label: "Thông tin doanh nghiệp cho Google (schema DaySpa)"
            widget: object
            collapsed: true
            fields:
              - { name: priceRange, label: "Khoảng giá", widget: string, required: false }
              - { name: openingHours, label: "Giờ mở cửa (chuẩn máy đọc)", widget: string, required: false, hint: "vd Mo-Su 09:00-22:00" }
              - { name: city, label: "Tỉnh / thành phố", widget: string, required: false }
              - { name: latitude, label: "Vĩ độ", widget: string, required: false, hint: "Lấy trên Google Maps: bấm chuột phải vào vị trí spa." }
              - { name: longitude, label: "Kinh độ", widget: string, required: false }
          - name: pages
            label: "SEO trang chủ & trang bài viết"
            widget: object
            fields:
              - { name: home, label: "Trang chủ", widget: object, collapsed: true, fields: &pagefields [
                  { name: title, label: "Tiêu đề", widget: string },
                  { name: description, label: "Mô tả", widget: text },
                  { name: keyword, label: "Từ khóa chính", widget: string, required: false },
                  { name: image, label: "Ảnh chia sẻ", widget: image, required: false } ] }
              - { name: pricing, label: "Trang bảng giá (/bang-gia/)", widget: object, collapsed: true, fields: *pagefields }
              - { name: blog, label: "Trang danh sách bài viết", widget: object, collapsed: true, fields: *pagefields }

  # ---------------- NỘI DUNG ----------------
  - name: content
    label: "Nội dung"
    editor: { preview: true }
    files:
      - name: services
        label: "Liệu trình & bảng giá"
        file: data/services.json
        fields:
          - name: items
            label: "Danh sách liệu trình"
            label_singular: "liệu trình"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: "Mã (không trùng, viết liền không dấu)", widget: string }
              - { name: name, label: "Tên liệu trình", widget: string }
              - { name: group, label: "Nhóm dịch vụ (bảng giá hiển thị theo nhóm)", widget: select, options: *groups, default: "Dịch vụ gội đầu" }
              - &slug { name: slug, label: "Đường dẫn (URL)", widget: string, required: false, hint: "Để trống = tự tạo từ tên. Đã đăng thì không nên đổi." }
              - { name: tag, label: "Nhãn (vd Phổ biến)", widget: string, required: false }
              - { name: icon, label: "Biểu tượng (khi chưa có ảnh)", widget: select, options: [ { label: "Cổ vai", value: neck }, { label: "Lưng", value: back }, { label: "Đầu", value: head }, { label: "Giọt nước", value: drop }, { label: "Khuôn mặt", value: face }, { label: "Ngôi sao", value: star } ], default: drop }
              - { name: img, label: "Ảnh", widget: image, required: false }
              - { name: desc, label: "Mô tả ngắn (hiện trên thẻ)", widget: text }
              - { name: content, label: "Nội dung trang chi tiết", widget: text, hint: "Cách 1 dòng trống giữa các đoạn. Tiêu đề phụ: '## '. Danh sách: mỗi dòng '- '." }
              - name: prices
                label: "Giá theo thời lượng (30 · 60 · 90 phút)"
                label_singular: "mức giá"
                widget: list
                allow_add: false
                allow_remove: false
                allow_reorder: false
                collapsed: true
                hint: "Mỗi liệu trình luôn có 3 mức 30, 60, 90 phút — chỉ cần sửa ô Giá."
                summary: "{{fields.min}} phút — {{fields.price}}đ"
                default: [ { min: 30, price: 0 }, { min: 60, price: 0 }, { min: 90, price: 0 } ]
                fields:
                  - { name: min, label: "Thời lượng (phút)", widget: hidden }
                  - { name: price, label: "Giá (đồng)", widget: number, value_type: int, min: 0, hint: "Nhập số, không dấu chấm. Vd 250000" }
              - &seo
                name: seo
                label: "SEO"
                widget: object
                collapsed: true
                required: false
                hint: "Điểm SEO và bản xem trước Google hiện ở khung bên phải."
                fields:
                  - { name: keyword, label: "Từ khóa chính", widget: string, required: false, hint: "vd massage cổ vai gáy quận 1 — mỗi trang một từ khóa." }
                  - { name: title, label: "Tiêu đề SEO", widget: string, required: false, hint: "Để trống = dùng tên. Nên 30–60 ký tự." }
                  - { name: description, label: "Mô tả SEO", widget: text, required: false, hint: "110–160 ký tự, có từ khóa và lời mời đặt lịch." }
                  - { name: image, label: "Ảnh chia sẻ", widget: image, required: false }
                  - { name: noindex, label: "Ẩn trang khỏi Google", widget: boolean, default: false, required: false }

      - name: faq
        label: "Hỏi đáp"
        file: data/faq.json
        fields:
          - name: items
            label: "Câu hỏi"
            label_singular: "câu hỏi"
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: "Câu hỏi", widget: string }
              - { name: a, label: "Trả lời", widget: text }

      - name: gallery
        label: "Không gian (5 ảnh)"
        file: data/gallery.json
        fields:
          - name: items
            label: "Ảnh không gian"
            label_singular: "ảnh"
            widget: list
            max: 5
            summary: "{{fields.caption}}"
            fields:
              - { name: caption, label: "Chú thích", widget: string }
              - { name: img, label: "Ảnh", widget: image, required: false }

  # ---------------- BÀI VIẾT (mỗi bài 1 file, có trang sửa riêng) ----------------
  - name: posts
    label: "Bài viết"
    label_singular: "bài viết"
    description: "Bấm vào một bài để mở trang sửa riêng của bài đó. Bấm nút “+ bài viết” để viết bài mới."
    folder: data/posts
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{fields.title}} · {{fields.category}} · {{fields.date}}"
    sortable_fields: ["title", "category", "date"]
    view_filters:
      - { label: "Chăm sóc cơ thể", field: category, pattern: "Chăm sóc cơ thể" }
      - { label: "Massage & trị liệu", field: category, pattern: "Massage" }
      - { label: "Gội đầu dưỡng sinh", field: category, pattern: "Gội đầu" }
      - { label: "Thư giãn & giấc ngủ", field: category, pattern: "Thư giãn" }
      - { label: "Tin tức Thiên Hà", field: category, pattern: "Tin tức" }
    editor: { preview: true }
    fields:
      - { name: id, label: "Mã bài (không bắt buộc)", widget: string, required: false, hint: "Để trống = tự dùng tên file của bài." }
      - { name: title, label: "Tiêu đề", widget: string }
      - name: category
        label: "Chuyên mục"
        widget: select
        required: false
        default: "Chăm sóc cơ thể"
        options: ["Chăm sóc cơ thể", "Massage & trị liệu", "Gội đầu dưỡng sinh", "Thư giãn & giấc ngủ", "Tin tức Thiên Hà"]
      - *slug
      - { name: excerpt, label: "Mô tả ngắn", widget: text }
      - { name: date, label: "Ngày đăng (dd/mm/yyyy)", widget: string }
      - { name: updated, label: "Ngày cập nhật (dd/mm/yyyy)", widget: string, required: false }
      - { name: img, label: "Ảnh đại diện", widget: image, required: false }
      - name: mode
        label: "Cách soạn nội dung"
        widget: select
        default: editor
        required: false
        options:
          - { label: "Trình soạn thảo (in đậm, tiêu đề, danh sách, link, ảnh…)", value: editor }
          - { label: "HTML (dán mã HTML)", value: html }
        hint: "Chọn HTML thì website hiển thị ô 'Nội dung HTML'; chọn Trình soạn thảo thì hiển thị ô 'Nội dung'. Ô còn lại được giữ nguyên, có thể đổi qua lại."
      - name: content
        label: "Nội dung (Trình soạn thảo)"
        widget: markdown
        required: false
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
        hint: "Nút 'Markdown' ở góc phải ô soạn thảo để xem/sửa dạng văn bản thô. Tiêu đề phụ dùng H2, H3."
      - name: html
        label: "Nội dung HTML"
        widget: code
        default_language: html
        allow_language_selection: false
        output_code_only: true
        required: false
        hint: "Chỉ dùng khi 'Cách soạn nội dung' = HTML. Dán phần thân bài (thẻ <h2>, <p>, <ul>, <img>…), không cần <html>, <head>, <body>. Mã <script> sẽ bị bỏ để an toàn."
      - { name: author, label: "Tác giả", widget: string, required: false }
      - { name: reviewer, label: "Người tham vấn chuyên môn (nếu có, người thật)", widget: string, required: false }
      - { name: sources, label: "Nguồn tham khảo", label_singular: "nguồn", widget: list, required: false, field: { name: source, label: "Nguồn", widget: string } }
      - *seo
