# ==========================================================
#  TRANG QUẢN TRỊ (Decap CMS) — Thiên Hà Wellness
#  Kho GitHub: https://github.com/Nam2501/Thien-Ha-Wellness
# ==========================================================
backend:
  name: github
  repo: Nam2501/Thien-Ha-Wellness
  branch: main
  # Đăng nhập GitHub qua hàm Cloudflare: functions/api/auth.js + callback.js
  base_url: https://thien-ha-wellness.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    create: "Thêm {{collection}} “{{slug}}”"
    update: "Cập nhật {{collection}} “{{slug}}”"
    delete: "Xóa {{collection}} “{{slug}}”"
    uploadMedia: "Tải ảnh “{{path}}”"
    deleteMedia: "Xóa ảnh “{{path}}”"

# Sửa thử trên máy: mở cửa sổ lệnh tại thư mục web và gõ  npx decap-server@3.11.3
local_backend: true

locale: vi
site_url: /
display_url: /
logo_url: /images/favicon.svg

media_folder: images/uploads
public_folder: images/uploads

collections:
  # ---------------- THÔNG TIN SPA ----------------
  - name: settings
    label: "Thông tin spa"
    editor: { preview: false }
    files:
      - name: site
        label: "Liên hệ & giờ mở cửa"
        file: data/site.json
        fields:
          - { name: name, label: "Tên spa", widget: string }
          - { name: phone, label: "Hotline (hiển thị)", widget: string, hint: "vd 0909 123 456 — tên, địa chỉ, SĐT phải khớp hồ sơ Google Maps (NAP)." }
          - { name: zalo, label: "Số Zalo (viết liền)", widget: string }
          - { name: zaloLink, label: "Link Zalo đầy đủ (nên điền)", widget: string, required: false, hint: "Link zalo.me/<số> chỉ mở được khi tài khoản cho phép người lạ tìm bằng số điện thoại. Dán link chia sẻ trang cá nhân hoặc link Zalo OA vào đây để luôn mở được." }
          - { name: email, label: "Email", widget: string, required: false }
          - { name: turnstileKey, label: "Chống bot đặt lịch giả — Turnstile Site key", widget: string, required: false, hint: "Lấy trong Cloudflare → Turnstile. Điền cùng lúc với biến bí mật TURNSTILE_SECRET trên Cloudflare. Để trống = tắt. Sổ lịch đặt: /admin/lich-dat/" }
          - { name: address, label: "Địa chỉ", widget: string, hint: "Ghi đầy đủ, giống hệt địa chỉ trên Google Business Profile." }
          - { name: hours, label: "Giờ mở cửa (hiển thị)", widget: string }
          - { name: mapUrl, label: "Link Google Maps của spa", widget: string }
          - { name: reviewUrl, label: "Link viết đánh giá Google", widget: string, hint: "Lấy trong Google Business Profile → Xin đánh giá." }
          - { name: facebook, label: "Link Facebook", widget: string, required: false }
          - name: socials
            label: "Nút liên hệ nổi (góc phải màn hình)"
            label_singular: "nút"
            widget: list
            collapsed: true
            hint: "Bật/tắt từng nút và dán link. Thứ tự trong danh sách = thứ tự hiển thị từ trên xuống (kéo để đổi). Nút đã bật mà chưa có link sẽ tự ẩn."
            summary: "{{fields.net}} — bật: {{fields.on}}"
            fields:
              - name: net
                label: "Kênh"
                widget: select
                options:
                  - { label: "Zalo (để trống link = dùng số/link Zalo ở trên)", value: zalo }
                  - { label: "Gọi điện (để trống = hotline ở trên)", value: phone }
                  - { label: "Messenger — vd https://m.me/tentrang", value: messenger }
                  - { label: "Facebook", value: facebook }
                  - { label: "TikTok", value: tiktok }
                  - { label: "Instagram", value: instagram }
                  - { label: "YouTube", value: youtube }
                  - { label: "WhatsApp — vd https://wa.me/84901234567", value: whatsapp }
                  - { label: "Telegram — vd https://t.me/tenkenh", value: telegram }
                  - { label: "KakaoTalk — link kênh/open chat", value: kakaotalk }
                  - { label: "Email (để trống = email ở trên)", value: email }
                  - { label: "Google Maps (để trống = link bản đồ ở trên)", value: maps }
              - { name: url, label: "Link", widget: string, required: false, hint: "Dán link đầy đủ bắt đầu bằng https://. Gọi điện: nhập số điện thoại. Email: nhập địa chỉ email." }
              - { name: "on", label: "Hiển thị trên website", widget: boolean, default: true, required: false }

  # ---------------- GIAO DIỆN (mỗi trang 1 mục) ----------------
  - name: layout
    label: "Giao diện"
    description: "Mỗi trang 1 mục: sửa chữ, ảnh, nút bấm và bật/tắt từng khu vực. Menu & chân trang dùng chung cho cả website. Đặt chữ trong dấu * để in nghiêng. Để trống ô nào = giữ chữ mặc định."
    editor: { preview: false }
    files:
      - name: home
        label: "Trang chủ"
        file: data/layout/home.json
        fields:
          - label: "Banner đầu trang"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Dòng chữ nhỏ", widget: string, required: false }
              - { name: title, label: "Tiêu đề lớn (H1)", widget: string, required: false, hint: "Đặt chữ trong dấu * để in nghiêng, vd: Thả trôi mệt mỏi, *như dòng nước* về biển lặng." }
              - { name: lead, label: "Đoạn mô tả", widget: text, required: false }
              - { name: btn1, label: "Nút chính", widget: object, fields: &btn [ { name: text, label: "Chữ trên nút", widget: string, required: false }, { name: link, label: "Link", widget: string, required: false, hint: "vd #dat-lich (khu đặt lịch), /bang-gia/, hoặc https://…" } ] }
              - { name: btn2, label: "Nút phụ", widget: object, fields: *btn }
          - { label: "Dải thông tin nhanh (giờ mở cửa, hotline, địa chỉ)", name: infobar, widget: object, collapsed: true, fields: [ &on { name: "on", label: "Hiển thị khu này", widget: boolean, default: true, required: false } ] }
          - label: "Khu 'Cơ thể bạn cần gì'"
            name: needs
            widget: object
            collapsed: true
            fields:
              - *on
              - &eyebrow { name: eyebrow, label: "Dòng chữ nhỏ", widget: string, required: false }
              - &title { name: title, label: "Tiêu đề", widget: string, required: false, hint: "Đặt chữ trong dấu * để in nghiêng." }
              - &sub { name: sub, label: "Mô tả ngắn", widget: text, required: false }
              - name: items
                label: "Các thẻ (nên để 4 thẻ)"
                label_singular: "thẻ"
                widget: list
                max: 8
                summary: "{{fields.title}} → {{fields.group}}"
                fields:
                  - { name: title, label: "Tiêu đề thẻ", widget: string }
                  - { name: desc, label: "Mô tả ngắn", widget: string }
                  - { name: icon, label: "Biểu tượng", widget: select, default: drop, options: [ { label: "Đầu", value: head }, { label: "Cơ thể (body)", value: body }, { label: "Giọt nước & sóng", value: drop }, { label: "Cổ vai", value: neck }, { label: "Lưng", value: back }, { label: "Khuôn mặt", value: face }, { label: "Ngôi sao", value: star } ] }
                  - { name: group, label: "Bấm vào thì tới nhóm dịch vụ", widget: select, options: &groups [ "Dịch vụ gội đầu", "Dịch vụ massage body thư giãn", "Dịch vụ massage dưỡng sinh & phục hồi sức khỏe", "Dịch vụ chăm sóc tai & mặt" ], hint: "Nhóm phải trùng với 'Nhóm dịch vụ' của các liệu trình trong Bảng giá." }
          - label: "Khu Bảng giá (trên trang chủ)"
            name: pricing
            widget: object
            collapsed: true
            fields: [ *on, *eyebrow, *title, *sub, { name: btn, label: "Chữ nút xem bảng giá", widget: string, required: false }, { name: note, label: "Ghi chú dưới bảng giá", widget: text, required: false } ]
          - label: "Khu Về chúng tôi"
            name: about
            widget: object
            collapsed: true
            fields:
              - *on
              - *eyebrow
              - *title
              - { name: text, label: "Nội dung", widget: text, required: false, hint: "Cách 1 dòng trống giữa các đoạn." }
              - { name: ticks, label: "Các ý nổi bật (dấu tích)", label_singular: "ý", widget: list, required: false, field: { name: text, label: "Ý", widget: string } }
              - { name: btn, label: "Nút", widget: object, fields: *btn }
              - { name: image, label: "Ảnh (để trống = hình trang trí sóng nước)", widget: thimage, required: false, hint: "Ảnh dọc, chụp thật tại spa. Alt lấy trong Thư viện ảnh." }
              - { name: badgeBig, label: "Vòng tròn — chữ lớn", widget: string, required: false }
              - { name: badgeSmall, label: "Vòng tròn — chữ nhỏ", widget: text, required: false, hint: "Xuống dòng trong ô = xuống dòng trên web." }
          - label: "Khu Vì sao khách quay lại"
            name: values
            widget: object
            collapsed: true
            fields: [ *on, *eyebrow, *title, { name: items, label: "Các ý (đánh số 01, 02… tự động)", label_singular: "ý", widget: list, summary: "{{fields.title}}", fields: &items [ { name: title, label: "Tiêu đề", widget: string }, { name: desc, label: "Mô tả", widget: string, required: false } ] } ]
          - label: "Khu Hành trình một buổi"
            name: journey
            widget: object
            collapsed: true
            fields: [ *on, *eyebrow, *title, { name: items, label: "Các bước", label_singular: "bước", widget: list, summary: "{{fields.title}}", fields: *items } ]
          - label: "Khu Không gian"
            name: gallery
            widget: object
            collapsed: true
            hint: "Ảnh không gian sửa ở Nội dung → Không gian."
            fields: [ *on, *eyebrow, *title, *sub ]
          - label: "Khu Đánh giá Google"
            name: reviews
            widget: object
            collapsed: true
            fields: [ *on, *eyebrow, *title, *sub, { name: box, label: "Chữ trong ô bên phải", widget: string, required: false }, { name: btnMap, label: "Chữ nút xem Google Maps", widget: string, required: false }, { name: btnReview, label: "Chữ nút viết đánh giá", widget: string, required: false } ]
          - label: "Khu Bài viết mới"
            name: posts
            widget: object
            collapsed: true
            fields: [ *on, *eyebrow, *title, { name: btn, label: "Chữ nút xem tất cả", widget: string, required: false }, { name: count, label: "Số bài hiển thị", widget: number, value_type: int, min: 1, max: 12, default: 3, required: false } ]
          - label: "Khu Hỏi đáp"
            name: faq
            widget: object
            collapsed: true
            hint: "Câu hỏi sửa ở Nội dung → Hỏi đáp."
            fields: [ *on, *eyebrow, *title, *sub ]
          - label: "Khu Đặt lịch (luôn hiển thị)"
            name: booking
            widget: object
            collapsed: true
            fields: [ *eyebrow, *title, { name: text, label: "Đoạn mô tả", widget: text, required: false }, { name: submit, label: "Chữ nút gửi", widget: string, required: false } ]
      - name: pricing
        label: "Trang Bảng giá"
        file: data/layout/pricing.json
        fields:
          - *eyebrow
          - { name: h1, label: "Tiêu đề trang (H1)", widget: string, required: false }
          - { name: lead, label: "Đoạn mô tả", widget: text, required: false, hint: "Để trống = tự ghi số liệu trình và giá thấp nhất." }
          - { name: helpTitle, label: "Ô tư vấn — tiêu đề", widget: string, required: false }
          - { name: helpText, label: "Ô tư vấn — nội dung", widget: text, required: false }
          - { name: helpBtn, label: "Ô tư vấn — chữ nút", widget: string, required: false }
          - { name: note, label: "Ghi chú cuối trang", widget: text, required: false }
      - name: blog
        label: "Trang Bài viết"
        file: data/layout/blog.json
        fields:
          - *eyebrow
          - { name: h1, label: "Tiêu đề trang (H1)", widget: string, required: false, hint: "Để trống = dùng tiêu đề SEO của trang bài viết." }
          - { name: lead, label: "Đoạn mô tả", widget: text, required: false }
      - name: service
        label: "Trang chi tiết liệu trình (dùng chung)"
        file: data/layout/service.json
        fields:
          - { name: priceTitle, label: "Cột phải — tiêu đề bảng giá", widget: string, required: false }
          - { name: bookBtn, label: "Chữ nút đặt lịch", widget: string, required: false }
          - { name: otherTitle, label: "Cột phải — tiêu đề liệu trình khác", widget: string, required: false }
          - { name: disclaimer, label: "Lưu ý cuối bài", widget: text, required: false }
      - name: post
        label: "Trang chi tiết bài viết (dùng chung)"
        file: data/layout/post.json
        fields:
          - { name: sideTitle, label: "Ô đặt lịch — tiêu đề", widget: string, required: false }
          - { name: sideText, label: "Ô đặt lịch — nội dung", widget: text, required: false }
          - { name: sideBtn, label: "Ô đặt lịch — chữ nút", widget: string, required: false }
          - { name: servicesTitle, label: "Cột phải — tiêu đề danh sách liệu trình", widget: string, required: false }
          - { name: disclaimer, label: "Lưu ý cuối bài", widget: text, required: false }
      - name: chrome
        label: "Menu & chân trang"
        file: data/layout/chrome.json
        fields:
          - name: menu
            label: "Menu đầu trang"
            label_singular: "mục"
            widget: list
            summary: "{{fields.label}} → {{fields.link}}"
            hint: "Kéo để đổi thứ tự. Link khu trên trang chủ: #ve-chung-toi, #khong-gian, #hoi-dap, #dat-lich, #bang-gia, #bai-viet."
            fields: &link [ { name: label, label: "Chữ hiển thị", widget: string }, { name: link, label: "Link", widget: string, hint: "vd /bang-gia/, #hoi-dap hoặc https://…" } ]
          - { name: headerBtn, label: "Chữ nút Đặt lịch trên đầu trang", widget: string, required: false }
          - { name: footerAbout, label: "Chân trang — giới thiệu ngắn", widget: text, required: false }
          - { name: hoursNote, label: "Chân trang — ghi chú dưới giờ mở cửa", widget: string, required: false }
          - { name: linksTitle, label: "Chân trang — tiêu đề cột link", widget: string, required: false }
          - { name: links, label: "Chân trang — các link", label_singular: "link", widget: list, summary: "{{fields.label}} → {{fields.link}}", fields: *link }
          - { name: copyright, label: "Dòng bản quyền (sau © năm)", widget: string, required: false }
          - { name: disclaimer, label: "Dòng lưu ý cuối trang", widget: string, required: false }
          - { name: mobileCall, label: "Thanh dưới cùng (điện thoại) — chữ nút gọi", widget: string, required: false }
          - { name: mobileBook, label: "Thanh dưới cùng (điện thoại) — chữ nút đặt lịch", widget: string, required: false }

  # ---------------- SEO TOÀN WEBSITE ----------------
  - name: seo
    label: "SEO toàn website"
    editor: { preview: true }
    files:
      - name: seo
        label: "Cài đặt SEO"
        file: data/seo.json
        fields:
          - { name: siteUrl, label: "Tên miền chính", widget: string, required: false, hint: "vd https://thienhawellness.vn — không có dấu / ở cuối." }
          - { name: titleTemplate, label: "Mẫu tiêu đề", widget: string, hint: "%s là tiêu đề từng trang." }
          - { name: defaultImage, label: "Ảnh chia sẻ mặc định (1200×630, JPG/PNG)", widget: thimage, required: false }
          - { name: gscVerification, label: "Mã xác minh Google Search Console", widget: string, required: false }
          - { name: ga4Id, label: "Mã Google Analytics 4 (G-…)", widget: string, required: false }
          - { name: noindexAll, label: "Chặn Google lập chỉ mục TOÀN website", widget: boolean, default: false, hint: "Chỉ bật khi đang thử nghiệm." }
          - name: business
            label: "Thông tin doanh nghiệp cho Google (schema DaySpa)"
            widget: object
            collapsed: true
            fields:
              - { name: priceRange, label: "Khoảng giá", widget: string, required: false }
              - { name: openingHours, label: "Giờ mở cửa (chuẩn máy đọc)", widget: string, required: false, hint: "vd Mo-Su 09:00-22:00" }
              - { name: city, label: "Tỉnh / thành phố", widget: string, required: false }
              - { name: latitude, label: "Vĩ độ", widget: string, required: false, hint: "Lấy trên Google Maps: bấm chuột phải vào vị trí spa." }
              - { name: longitude, label: "Kinh độ", widget: string, required: false }
          - name: pages
            label: "SEO trang chủ & trang bài viết"
            widget: object
            fields:
              - { name: home, label: "Trang chủ", widget: object, collapsed: true, fields: &pagefields [
                  { name: title, label: "Tiêu đề", widget: string },
                  { name: description, label: "Mô tả", widget: text },
                  { name: keyword, label: "Từ khóa chính", widget: string, required: false },
                  { name: image, label: "Ảnh chia sẻ", widget: thimage, required: false } ] }
              - { name: pricing, label: "Trang bảng giá (/bang-gia/)", widget: object, collapsed: true, fields: *pagefields }
              - { name: blog, label: "Trang danh sách bài viết", widget: object, collapsed: true, fields: *pagefields }

  # ---------------- NỘI DUNG ----------------
  - name: content
    label: "Nội dung"
    editor: { preview: true }
    files:
      - name: services
        label: "Liệu trình & bảng giá"
        file: data/services.json
        fields:
          - name: items
            label: "Danh sách liệu trình"
            label_singular: "liệu trình"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: "Mã (không trùng, viết liền không dấu)", widget: string }
              - { name: name, label: "Tên liệu trình", widget: string }
              - { name: group, label: "Nhóm dịch vụ (bảng giá hiển thị theo nhóm)", widget: select, options: *groups, default: "Dịch vụ gội đầu" }
              - &slug { name: slug, label: "Đường dẫn (URL)", widget: string, required: false, hint: "Để trống = tự tạo từ tên. Đã đăng thì không nên đổi." }
              - { name: tag, label: "Nhãn (vd Phổ biến)", widget: string, required: false }
              - { name: icon, label: "Biểu tượng (khi chưa có ảnh)", widget: select, options: [ { label: "Cổ vai", value: neck }, { label: "Lưng", value: back }, { label: "Đầu", value: head }, { label: "Giọt nước", value: drop }, { label: "Khuôn mặt", value: face }, { label: "Ngôi sao", value: star } ], default: drop }
              - { name: img, label: "Ảnh", widget: thimage, required: false }
              - { name: desc, label: "Mô tả ngắn (hiện trên thẻ)", widget: text }
              - { name: content, label: "Nội dung trang chi tiết", widget: text, hint: "Cách 1 dòng trống giữa các đoạn. Tiêu đề phụ: '## '. Danh sách: mỗi dòng '- '." }
              - name: prices
                label: "Giá theo thời lượng (30 · 60 · 90 phút)"
                label_singular: "mức giá"
                widget: list
                allow_add: false
                allow_remove: false
                allow_reorder: false
                collapsed: true
                hint: "Mỗi liệu trình luôn có 3 mức 30, 60, 90 phút — chỉ cần sửa ô Giá."
                summary: "{{fields.min}} phút — {{fields.price}}đ"
                default: [ { min: 30, price: 0 }, { min: 60, price: 0 }, { min: 90, price: 0 } ]
                fields:
                  - { name: min, label: "Thời lượng (phút)", widget: hidden }
                  - { name: price, label: "Giá (đồng)", widget: number, value_type: int, min: 0, hint: "Nhập số, không dấu chấm. Vd 250000" }
              - &seo
                name: seo
                label: "SEO"
                widget: object
                collapsed: true
                required: false
                hint: "Điểm SEO và bản xem trước Google hiện ở khung bên phải."
                fields:
                  - { name: keyword, label: "Từ khóa chính", widget: string, required: false, hint: "vd massage cổ vai gáy quận 1 — mỗi trang một từ khóa." }
                  - { name: title, label: "Tiêu đề SEO", widget: string, required: false, hint: "Để trống = dùng tên. Nên 30–60 ký tự." }
                  - { name: description, label: "Mô tả SEO", widget: text, required: false, hint: "110–160 ký tự, có từ khóa và lời mời đặt lịch." }
                  - { name: image, label: "Ảnh chia sẻ", widget: thimage, required: false }
                  - { name: noindex, label: "Ẩn trang khỏi Google", widget: boolean, default: false, required: false }

      - name: faq
        label: "Hỏi đáp"
        file: data/faq.json
        fields:
          - name: items
            label: "Câu hỏi"
            label_singular: "câu hỏi"
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: "Câu hỏi", widget: string }
              - { name: a, label: "Trả lời", widget: text }

      - name: gallery
        label: "Không gian (5 ảnh)"
        file: data/gallery.json
        fields:
          - name: items
            label: "Ảnh không gian"
            label_singular: "ảnh"
            widget: list
            max: 5
            summary: "{{fields.caption}}"
            fields:
              - { name: caption, label: "Chú thích", widget: string }
              - { name: img, label: "Ảnh", widget: thimage, required: false }

  # ---------------- BÀI VIẾT (mỗi bài 1 file, có trang sửa riêng) ----------------
  - name: posts
    label: "Bài viết"
    label_singular: "bài viết"
    description: "Bấm vào một bài để mở trang sửa riêng của bài đó. Bấm nút “+ bài viết” để viết bài mới."
    folder: data/posts
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{fields.title}} · {{fields.category}} · {{fields.date}}"
    sortable_fields: ["title", "category", "date"]
    view_filters:
      - { label: "Chăm sóc cơ thể", field: category, pattern: "Chăm sóc cơ thể" }
      - { label: "Massage & trị liệu", field: category, pattern: "Massage" }
      - { label: "Gội đầu dưỡng sinh", field: category, pattern: "Gội đầu" }
      - { label: "Thư giãn & giấc ngủ", field: category, pattern: "Thư giãn" }
      - { label: "Tin tức Thiên Hà", field: category, pattern: "Tin tức" }
    editor: { preview: true }
    fields:
      - { name: id, label: "Mã bài", widget: string, required: false, hint: "Để trống = tự dùng tên file của bài." }
      - { name: title, label: "Tiêu đề", widget: string }
      - { name: slug, label: "Đường dẫn", widget: slugurl, prefix: "/bai-viet/", required: false, hint: "Để trống = tự tạo từ tiêu đề. Bài đã đăng thì không nên đổi (link cũ sẽ hỏng)." }
      - name: category
        label: "Chuyên mục"
        widget: select
        required: false
        default: "Chăm sóc cơ thể"
        options: ["Chăm sóc cơ thể", "Massage & trị liệu", "Gội đầu dưỡng sinh", "Thư giãn & giấc ngủ", "Tin tức Thiên Hà"]
      - { name: excerpt, label: "Mô tả ngắn", widget: text }
      - { name: date, label: "Ngày đăng (dd/mm/yyyy)", widget: string }
      - { name: updated, label: "Ngày cập nhật (dd/mm/yyyy)", widget: string, required: false }
      - { name: img, label: "Ảnh đại diện", widget: thimage, required: false }
      - { name: mode, widget: hidden, default: html }
      - name: html
        label: "Nội dung"
        widget: wpeditor
        required: false
        hint: "Tab Trực quan: soạn như Word. Tab Mã: sửa HTML trực tiếp. Nút Thêm tệp: mở Thư viện ảnh (tải ảnh giữ nguyên tên, nhập alt/title/chú thích, chọn kích thước). Bấm vào ảnh trong bài để sửa lại. Mã <script> sẽ bị bỏ khi đăng để an toàn."
      - { name: content, widget: hidden, required: false }
      - { name: author, label: "Tác giả", widget: string, required: false }
      - { name: reviewer, label: "Người tham vấn chuyên môn (nếu có, người thật)", widget: string, required: false }
      - { name: sources, label: "Nguồn tham khảo", label_singular: "nguồn", widget: list, required: false, field: { name: source, label: "Nguồn", widget: string } }
      - *seo
